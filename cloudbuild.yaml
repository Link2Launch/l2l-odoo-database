steps:
  # 1. Use a standard Python builder
  - name: 'python:3.10'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        echo "Installing system dependencies..."
        apt-get update
        apt-get install -y \
          build-essential \
          libpq-dev \
          libsasl2-dev \
          libldap2-dev \
          libssl-dev \
          nodejs \
          npm

        echo "Installing Python dependencies..."
        pip install --upgrade pip
        pip install -r requirements.txt

        echo "Installing wkhtmltopdf (if needed)..."
        apt-get install -y wkhtmltopdf || true

        echo "Running Odoo database update..."
        

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s


