steps:
  # Step 1: Build the image using Google Buildpacks (no Dockerfile)
  - name: 'gcr.io/buildpacks/builder'
    args:
      [
        'build',
        'gcr.io/$PROJECT_ID/odoo',
        '--env', 'GOOGLE_RUNTIME=python',
        '--env', 'GOOGLE_ENTRYPOINT=chmod u+x start_server_heroku.sh && ./start_server_heroku.sh'
      ]

images:
  - 'gcr.io/$PROJECT_ID/odoo'